<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="all">

        <div class="left">

            <div class="top">
                <h1> Create Your Account </h1>
                <h5> Welcome back! Please enter your details. </h5>
            </div>

            <form action="#">

                
                <div class="inputcontainer">
                <label for="name">Name </label>
                <input type="text" id="name" name="name" placeholder=" Enter your name" minlength="1">
                </div>

                <div class="inputcontainer">
                <label for="email">Email </label>
                <input type="email" id="email" name="email" placeholder=" Enter your email" minlength="6">
                </div>


                <div class="inputcontainer">
                <label for="password">Password</label>
                <input type="password" name="password" placeholder=" Password" minlength="8">
                </div>

                <div class="inputcontainer">
                    <div>
                        <input type="checkbox" id="tandc"> 
                        <label for="tandc"> I agree to all terms and conditions </label>
                    </div>    
                </div>

                <div class="inputcontainer">
                <button type="submit" > Sign up </button>
                </div>

                
            </form>

        </div>

        <div class="right">
             <img src="images/pexels-catiamatos-1072179.jpg" alt="image"> 
        </div>

    </div>

    
    
</body>
</html>
